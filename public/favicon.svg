<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070f" />
      <stop offset="100%" stop-color="#0d0d1a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#64ffda" stroke-width="2.5" />
  <!-- Sparkle dot -->
  <circle cx="48" cy="16" r="3" fill="#64ffda" />
  <!-- Monogram PS -->
  <text x="31" y="42" font-family="'Space Mono', monospace, sans-serif" font-size="26" font-weight="900" fill="url(#cyanGrad)" text-anchor="middle" letter-spacing="1">PS</text>
</svg>
